name: BuildersWand
version: '1.6.0'
description: Highly configurable, survival-friendly building wands » straw.hat on SpigotMC
author: heypr
main: dev.heypr.buildersWand.BuildersWand
api-version: '1.21'
prefix: BuildersWand

dependencies:
  server:
    SuperiorSkyblock2:
      load: BEFORE
      required: false
      join-classpath: true
    WorldGuard:
      load: BEFORE
      required: false
      join-classpath: true
    Lands:
      load: BEFORE
      required: false
      join-classpath: true
    BentoBox:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  builderswand.admin:
    description: Master permission for BuildersWand
    default: op
  builderswand.notify.update:
    description: Notified when a new update is available
    default: op
  builderswand.give:
    description: Allows giving wands
    default: op
  builderswand.reload:
    description: Allows reloading config
    default: op
  builderswand.list:
    description: Allows listing wands
    default: op
  builderswand.storage.list:
    description: Allows viewing wand storage disk usage summary
    default: op
  builderswand.storage.inspect:
    description: Allows viewing and editing a specific wand's storage contents by UUID
    default: op
  builderswand.storage.prune:
    description: Allows pruning stale wand storage files
    default: op
  builderswand.use.*:
    description: Allows using all wands
    default: op
  builderswand.use:
    description: Allows using specific wands
    default: notop
